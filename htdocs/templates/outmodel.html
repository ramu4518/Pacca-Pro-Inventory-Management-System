    <div id="outputContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.js"></script>
    <script>

        // This function is called when the "Finish" button is clicked
        function finish() {
            window.location.href = 'http://127.0.0.1/Outmodell.php'; // Navigates to outmodel.php
        }




        var socket = io();

        socket.on('connect', function () {
            console.log('Connected to server.');
        });

        socket.on('qr_code_processed', function (data) {
            var message = data.message;
            var p = document.createElement('p');
            p.textContent = message;
            document.getElementById('outputContainer').appendChild(p);
        });

        function startScanning() {
            fetch('/start_scanning', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        console.log('Scanning started.');
                    } else {
                        console.error('Error starting scanning.');
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function stopScanning() {
            fetch('/stop_scanning', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        console.log('Scanning stopped.');
                    } else {
                        console.error('Error stopping scanning.');
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        var socket = io.connect('http://' + document.domain + ':' + location.port);

        console.log('Connected to server.');

        socket.on('processed_pending_data', function (data) {
            updateSalesOrderTable(data);
        });

        setInterval(fetchSalesOrderData, 10000);

        function fetchSalesOrderData() {
            var xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    updateSalesOrderTable(data);
                }
            };

            xhr.open('GET', 'http://127.0.0.1/templates/fetch_sales_order_data.php', true);
            xhr.send();
        }

        function updateSalesOrderTable(data) {
            var tableBody = document.getElementById('tableBody');

            tableBody.innerHTML = '';

            data.forEach(function (rowData, index) {
                var newRow = tableBody.insertRow();
                newRow.dataset.productId = rowData['ID'];

                var cellIndex = newRow.insertCell();
                cellIndex.textContent = index + 1;

                Object.values(rowData).forEach(function (cellData, cellIndex) {
                    var cell = newRow.insertCell();
                    cell.textContent = cellData;

                    if (cellIndex === 4 && cellData == 0) {
                        newRow.classList.add('green-row');
                    }
                });
            });

            updateRowColors(data);
        }

        function updateRowColors(data) {
            var tableBody = document.getElementById('tableBody');
            var rows = tableBody.rows;

            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                var pendingCell = row.cells[4];
                if (pendingCell && pendingCell.textContent.trim() == '0') {
                    row.classList.add('green-row');
                } else {
                    row.classList.remove('green-row');
                }
            }
        }

        function fetchParticularsData() {
            var xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = xhr.responseText.split(',');
                    var particulars = data[0];
                    var orderid = data[1];
                    document.getElementById('orderField').textContent = particulars;
                    document.getElementById('orderidfield').textContent = orderid;
                }
            };

            xhr.open('GET', 'http://127.0.0.1/templates/fetch_order_details.php', true);
            xhr.send();
        }

        fetchParticularsData();
        setInterval(fetchParticularsData, 10000);

        fetchSalesOrderData();
        setInterval(fetchSalesOrderData, 5000);

        socket.emit('start_fetching_processed_pending', 'product_name');

        socket.on('gif_trigger', function (data) {
            var gifContainer = document.getElementById('gif-container');
            var correctGif = document.getElementById('correct-gif');
            var incorrectGif = document.getElementById('incorrect-gif');
            var checkgif = document.getElementById('check-gif');

            gifContainer.style.display = 'block';

            if (data.value === 1) {
                correctGif.style.display = 'block';
                incorrectGif.style.display = 'none';
                checkgif.style.display = 'none';
            }
            else if (data.value === 2) {
                correctGif.style.display = 'none';
                checkgif.style.display = 'block';
                incorrectGif.style.display = 'none';
            }
            else if(data.value === 0) {
                correctGif.style.display = 'none';
                checkgif.style.display = 'none';
                incorrectGif.style.display = 'block';
            }else{
                correctGif.style.display = 'none';
                checkgif.style.display = 'none';
                incorrectGif.style.display = 'block';
            }

            setTimeout(function () {
                gifContainer.style.display = 'none';
                correctGif.style.display = 'none';
                incorrectGif.style.display = 'none';
            }, 5000);
        });

        function printOrderDetails() {
            var orderId = document.getElementById('orderidfield').textContent.trim();
            var particulars = document.getElementById('orderField').textContent.trim();
            var salesOrderTable = document.getElementById('salesOrderTable').outerHTML;

            var printWindow = window.open('', '_blank');

            var content = `
                <html>
                <head>
                    <title>Order Details</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                            padding: 1rem;
                        }
                        .order-info {
                            text-align: center;
                            margin-bottom: 20px;
                        }
                        .order-info label {
                            font-size: 2.0rem;
                            font-weight: 400;
                        }
                        .order-info span {
                            font-size: 2.0rem;
                            font-weight: 400;
                        }
                        h1 {
                            text-align: center;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-top: 20px;
                        }
                        th, td {
                            border: 1px solid #ddd;
                            padding: 8px;
                            text-align: left;
                        }
                        th {
                            background-color: #f2f2f2;
                        }
                        .green-row {
                            background-color: lightgreen;
                        }
                    </style>
                </head>
                <body>
                    <div class="order-info">
                        <label for="orderidfield"><b>Order ID:</b></label>
                        <span>${orderId}</span>
                    </div>

                    <div class="order-info">
                        <label for="orderField"><b>Order:</b></label>
                        <span>${particulars}</span>
                    </div>

                    <div style="text-align: center;">
                        <h1><b>Sales Order Data</b></h1>
                    </div>

                    ${salesOrderTable}
                </body>
                </html>
            `;

            printWindow.document.open();
            printWindow.document.write(content);
            printWindow.document.close();
            printWindow.print();
        }

        function getProductName() {
            var row = document.querySelector('#salesOrderTable tbody tr');

            if (row && row.cells.length > 1) { // Ensure row and the second cell exist
                var productName = row.cells[1].textContent.trim();
                console.log("Product:", productName); // Debugging
                return productName;
            } else {
                console.error("Product data not found!");
                return "No product found";
            }
        }

        // Example: Assign the product name to an element before printing
        document.getElementById("productNameElement").textContent = getProductName();


        function calculateTotalDemand() {
            var rows = document.querySelectorAll('#salesOrderTable tbody tr');
            var totalDemand = 0;

            rows.forEach(function (row) {
                var demand = parseInt(row.cells[2].textContent);
                if (!isNaN(demand)) {
                    totalDemand += demand;
                }
            });

            return totalDemand;
        }

        function calculateProcessed() {
            var rows = document.querySelectorAll('#salesOrderTable tbody tr');
            var processed = 0;

            rows.forEach(function (row) {
                var process = parseInt(row.cells[3].textContent);
                if (!isNaN(process)) {
                    processed += process;
                }
            });

            return processed;
        }

    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function (event) {
            const showNavbar = (toggleId, navId, bodyId, headerId) => {
                const toggle = document.getElementById(toggleId),
                    nav = document.getElementById(navId),
                    bodypd = document.getElementById(bodyId),
                    headerpd = document.getElementById(headerId);

                // Validate that all variables exist
                if (toggle && nav && bodypd && headerpd) {
                    toggle.addEventListener('click', () => {
                        // Toggle navbar
                        nav.classList.toggle('show');
                        // Change icon
                        toggle.classList.toggle('bx-x');
                        // Add padding to body
                        bodypd.classList.toggle('body-pd');
                        // Add padding to header
                        headerpd.classList.toggle('body-pd');
                    });

                    // Initialize the navbar in expanded view
                    nav.classList.add('show');
                    toggle.classList.add('bx-x');
                    bodypd.classList.add('body-pd');
                    headerpd.classList.add('body-pd');
                }
            };

            showNavbar('header-toggle', 'nav-bar', 'body-pd', 'header');

            /*===== LINK ACTIVE =====*/
            const linkColor = document.querySelectorAll('.nav_link');

            function colorLink() {
                if (linkColor) {
                    linkColor.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                }
            }
            linkColor.forEach(l => l.addEventListener('click', colorLink));
        });



    </script>
