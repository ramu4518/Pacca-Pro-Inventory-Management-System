function fetchSalesOrderData() {
    var xhr = new XMLHttpRequest(); 

    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            updateSalesOrderTable(data);
        }
    };

    xhr.open('GET', 'http://127.0.0.1/templates/fetch_sales_order_data.php', true);
    xhr.send();
}

// Function to update the sales order table with data received from the server
function updateSalesOrderTable(data) {
    var tableBody = document.getElementById('tableBody');

    // Clear the existing table rows
    tableBody.innerHTML = '';

    data.forEach(function(rowData, index) {
        var newRow = tableBody.insertRow();
        newRow.dataset.productId = rowData['ID']; // Set the data-product-id attribute

        // Insert the serial number (index + 1)
        var cellIndex = newRow.insertCell();
        cellIndex.textContent = index + 1;

        Object.values(rowData).forEach(function(cellData) {
            var cell = newRow.insertCell();
            cell.textContent = cellData;
        });

       
        if (rowData['pending'] === 0) {
            newRow.classList.add('green-row');
        }
    });
}
function fetchParticularsData() {
    var xhr = new XMLHttpRequest();

    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var data = xhr.responseText.split(','); // Split the response by comma
            var particulars = data[0];
            var orderid = data[1];
            document.getElementById('orderField').textContent = particulars;
            document.getElementById('orderidfield').textContent = orderid;
        }
    };

    xhr.open('GET', 'http://127.0.0.1/templates/fetch_order_details.php', true);
    xhr.send();
}

// Call the fetchParticularsData function initially and at regular intervals

        socket.on('gif_trigger', function(data) {
    var gifContainer = document.getElementById('gif-container');
    var correctGif = document.getElementById('correct-gif');
    var incorrectGif = document.getElementById('incorrect-gif');
    var checkgif = document.getElementById('check-gif');

    gifContainer.style.display = 'block';

    if (data.value === 1) {
        correctGif.style.display = 'block';
        incorrectGif.style.display = 'none';
        checkgif.style.display = 'none';
    } 
    else if(data.value === 2){
        correctGif.style.display = 'none';
        checkgif.style.display = 'block';
        incorrectGif.style.display = 'none';
    }
    else {
        correctGif.style.display = 'none';
        checkgif.style.display = 'none';
        incorrectGif.style.display = 'block';
    }

    // Hide the GIFs after 5 seconds
    setTimeout(function() {
        gifContainer.style.display = 'none';
        correctGif.style.display = 'none';
        incorrectGif.style.display = 'none';
    }, 5000);
});
