        <!-- Add the two buttons for starting and stopping scanning -->

        <button id="stopBtn" onclick="stopScanning()">Stop Scanning</button>
        
        <br>
        <table id="stockTable">
            <thead>
                <tr>
                    <th scope="col">Product</th>
                    <th scope="col">Quantity</th>
                </tr>
            </thead>
            <tbody id="stockBody">
                <!-- Stock data will be dynamically added here -->
            </tbody>
        </table>

    <div id="outputContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.js"></script>
    <script>
        var socket = io();

        socket.on('connect', function() {
            console.log('Connected to server.');
        });

        socket.on('qr_code_processed', function(data) {
            var message = data.message;
            var p = document.createElement('p');
            p.textContent = message;
            document.getElementById('outputContainer').appendChild(p);
        });

        function startScanning() {
            fetch('/start_scanning', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        console.log('Scanning started.');
                    } else {
                        console.error('Error starting scanning.');
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function stopScanning() {
            fetch('/stop_scanning', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        console.log('Scanning stopped.');
                    } else {
                        console.error('Error stopping scanning.');
                    }
                })
                .catch(error => console.error('Error:', error));
        }
        function updateStockTable(data) {
        var stockBody = document.getElementById('stockBody');
       

        data.forEach(item => {
            var row = document.createElement('tr');
            var productCell = document.createElement('td');
            var quantityCell = document.createElement('td');

            productCell.textContent = item.product;
            quantityCell.textContent = item.quantity;

            row.appendChild(productCell);
            row.appendChild(quantityCell);

            stockBody.appendChild(row);
        });
    }

    // Socket event for receiving updated stock data
    socket.on('update_stock', function(data) {
        console.log('Received updated stock:', data);
        updateStockTable(data);
    });
    </script>

const showNavbar = (toggleId, navId, bodyId, headerId) =>{
    const toggle = document.getElementById(toggleId),
        nav = document.getElementById(navId),
        bodypd = document.getElementById(bodyId),
        headerpd = document.getElementById(headerId)

// Validate that all variables exist
    if(toggle && nav && bodypd && headerpd){
        toggle.addEventListener('click', ()=>{
// show navbar
            nav.classList.toggle('show')
// change icon
            toggle.classList.toggle('bx-x')
// add padding to body
            bodypd.classList.toggle('body-pd')
// add padding to header
            headerpd.classList.toggle('body-pd')
        })
    }
}
